                  raise MobSFError(f"--source {argument!r}: the platform is android or ios.")
              if os.path.isabs(directory) or ".." in Path(directory).parts:
                  raise MobSFError(f"--source {argument!r}: give a directory relative to the repository root.")
              path = (root / directory).resolve()
              if not path.is_dir():
                  raise MobSFError(f"--source {argument!r}: {directory} is not a directory.")
              layout = source_layout(path)
              if platform == "android" and layout != "android":
                  raise MobSFError(
                      f"--source {argument!r}: MobSF analyses an Android project with the Android Studio layout, "
                      "app/src/main/AndroidManifest.xml next to app/src/main/java or kotlin (or the Eclipse layout), in "
                      f"{directory} or one directory below it, and only that app module. Analyse the built APK instead."
                  )
              if platform == "ios" and layout != "ios":
                  raise MobSFError(
                      f"--source {argument!r}: "
                      + (
                          f"{directory} holds an Android project as well, which MobSF would analyse instead; "
                          "point it at the directory of the Xcode project."
                          if layout == "android"
                          else f"no .xcodeproj in {directory} or one directory below it."
                      )
                  )
              suffix = "" if directory in (".", "") else "-" + directory
              return Target("source", argument, path, platform=platform, slug=slugify(platform + suffix))


          def _android_layout(directory: Path) -> bool:
              eclipse = (directory / "AndroidManifest.xml").is_file() and (directory / "src").exists()
              main = directory / "app" / "src" / "main"
              studio = (main / "AndroidManifest.xml").is_file() and ((main / "java").exists() or (main / "kotlin").exists())
              return eclipse or studio


          def _subdirectories(directory: Path) -> List[Path]:
              return sorted(p for p in directory.iterdir() if p.is_dir() and p.name not in SKIPPED_DIRECTORIES)


          def source_layout(directory: Path) -> str:
              """What MobSF makes of a zip of this directory: "android", "ios" or "" (not supported). MobSF
              checks for an Android project first, then for an Xcode project, each at the top or one
              directory below it (StaticAnalyzer/views/android/apk.py, valid_source_code)."""
              if _android_layout(directory) or any(_android_layout(d) for d in _subdirectories(directory)):
                  return "android"
              for candidate in [directory] + _subdirectories(directory):
                  if any(p.suffix == ".xcodeproj" for p in candidate.iterdir()):
                      return "ios"
              return ""


          def _readable_plist(path: Path) -> bool:
              try:
                  with open(path, "rb") as plist:
                      plistlib.load(plist)
                  return True
              except Exception:  # pylint: disable=broad-exception-caught  # any parse error, whatever its class
                  return False


          def zip_source(directory: Path, destination: Path, left_out: Optional[List[str]] = None) -> int:
              """
              The project as MobSF expects it, paths relative to the project directory.

              A property list MobSF cannot read is left out (and named in left_out): MobSF 4.5.3 takes any
              *Info.plist for the app's, and one that does not parse (a leftover GoogleService-Info copy
              with a tab before <?xml) made the whole iOS analysis fail with "AttributeError: 'NoneType'
              object has no attribute 'get'".
              """
              count = 0
              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED) as archive:
                  for current, subdirectories, files in os.walk(directory):
                      subdirectories[:] = sorted(d for d in subdirectories if d not in SKIPPED_DIRECTORIES)
                      for name in sorted(files):
                          path = Path(current) / name
                          if path.is_symlink() or not path.is_file():
                              continue
                          relative = path.relative_to(directory).as_posix()
                          if name.endswith(".plist") and not _readable_plist(path):
                              if left_out is not None:
                                  left_out.append(relative)
                              continue
                          archive.write(path, relative)
                          count += 1
              return count


          IOS_SOURCE_FAILED = (
              "MobSF could not analyse the iOS source in {source} (an error inside MobSF: {error}). Analyse the built app "
              "instead: build the .ipa (flutter build ipa, or an Xcode archive exported as .ipa) and name it with "
              "app: in .tdxguard.yml (mobile_app: in the workflow)."
          )


          # --- the container ---------------------------------------------------------------------


          Runner = Callable[..., subprocess.CompletedProcess]


          def _log(message: str) -> None:
              print(message, flush=True)


          def _run(args: List[str], timeout: Optional[int] = None) -> subprocess.CompletedProcess:
              return subprocess.run(args, capture_output=True, text=True, timeout=timeout, check=False)  # nosec B603


          class MobSF:
              """A MobSF container, driven with `docker exec ... curl` against its own loopback."""

              def __init__(self, image: str = MOBSF_IMAGE, run: Runner = _run, log: Callable[[str], None] = _log, name: str = ""):
                  self.image = image
                  self.name = name or f"tdxguard-mobsf-{secrets.token_hex(4)}"
                  self.key = secrets.token_hex(24)
                  self.run = run
                  self.log = log
                  self.started = False

              def start(self, timeout: int = START_TIMEOUT) -> None:
                  result = self.run(
                      [
                          "docker", "run", "-d", "--name", self.name,
                          "-e", f"MOBSF_API_KEY={self.key}",
                          "-e", "MOBSF_DOMAIN_MALWARE_SCAN=0",
                          self.image,
                      ]
                  )  # fmt: skip
                  if result.returncode != 0:
                      raise MobSFError(f"docker run {self.image} failed: {(result.stderr or '').strip()[-300:]}")
                  self.started = True
                  deadline = time.monotonic() + timeout
                  while time.monotonic() < deadline:
                      probe = self.run(
                          ["docker", "exec", self.name, "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", f"{API}/login/"]
                      )
                      if probe.returncode == 0 and (probe.stdout or "").strip()[:1] in ("2", "3"):
                          return
                      state = self.run(["docker", "inspect", "-f", "{{.State.Running}}", self.name])
                      if (state.stdout or "").strip() == "false":
                          logs = self.run(["docker", "logs", "--tail", "20", self.name])
                          raise MobSFError("MobSF stopped while starting: " + ((logs.stdout or "") + (logs.stderr or ""))[-500:])
                      time.sleep(5)
                  raise MobSFError(f"MobSF did not come up within {timeout}s.")

              def isolate(self) -> None:
                  """Disconnect the container from every network: from here on it reaches nothing but itself."""
                  result = self.run(["docker", "inspect", "-f", "{{json .NetworkSettings.Networks}}", self.name])
                  try:
                      networks = list(json.loads(result.stdout or "{}") or {})
                  except ValueError:
                      networks = []
                  for network in networks:
                      if network == "none":
                          continue
                      disconnected = self.run(["docker", "network", "disconnect", "-f", network, self.name])
                      if disconnected.returncode != 0:
                          raise MobSFError(
                              f"Could not disconnect MobSF from the network {network}: {(disconnected.stderr or '').strip()}. "
                              "Not analysing the app with network access."
                          )

              def api(self, endpoint: str, *fields: str, timeout: int = SCAN_TIMEOUT) -> str:
                  args = ["docker", "exec", self.name, "curl", "-sS", "-m", str(timeout), "-H", f"Authorization: {self.key}"]
                  for field in fields:
                      args += ["-F" if field.startswith("file=@") else "--data-urlencode", field]
                  args.append(f"{API}/api/v1/{endpoint}")
                  result = self.run(args, timeout=timeout + 60)
                  if result.returncode != 0:
                      raise MobSFError(f"MobSF {endpoint} failed: {(result.stderr or '').strip()[-300:]}")
                  return result.stdout or ""

              def analyse(self, path: Path, out: Path) -> dict:
                  """Upload, scan and fetch the JSON report of one file; returns the report."""
                  inside = f"/tmp/{secrets.token_hex(4)}-{re.sub(r'[^A-Za-z0-9._-]', '_', path.name)}"  # nosec B108
                  copied = self.run(["docker", "cp", str(path), f"{self.name}:{inside}"], timeout=600)
                  if copied.returncode != 0:
                      raise MobSFError(f"docker cp {path.name} failed: {(copied.stderr or '').strip()[-300:]}")
                  # docker cp keeps the file's mode, and MobSF does not run as root: an app readable by its
                  # owner only (a umask of 077) made the upload fail with "curl: (26) Failed to open/read".
                  readable = self.run(["docker", "exec", "-u", "0", self.name, "chmod", "a+r", inside], timeout=60)
                  if readable.returncode != 0:
                      raise MobSFError(f"Could not make {path.name} readable for MobSF: {(readable.stderr or '').strip()[-300:]}")
                  upload = _json(self.api("upload", f"file=@{inside}"), "upload")
                  if not upload.get("hash"):
                      raise MobSFError(f"MobSF did not accept {path.name}: {upload.get('error') or upload}")
                  scan = _json(self.api("scan", f"hash={upload['hash']}"), "scan")
                  if scan.get("error"):
                      raise MobSFError(f"MobSF could not analyse {path.name}: {scan['error']}")
                  text = self.api("report_json", f"hash={upload['hash']}")
                  report = _json(text, "report_json")
                  if not isinstance(report.get("app_type"), str):
                      raise MobSFError(f"MobSF returned no report for {path.name}: {str(report.get('error') or '')[:300]}")
                  out.write_text(text, encoding="utf-8")
                  return report

              def stop(self) -> None:
                  if self.started:
                      self.run(["docker", "rm", "-f", "-v", self.name])
                      self.started = False


          def _json(text: str, endpoint: str) -> dict:
              try:
                  data = json.loads(text)
              except ValueError as e:
                  raise MobSFError(f"MobSF {endpoint} answered no JSON: {text[:200]!r}") from e
              if not isinstance(data, dict):
                  raise MobSFError(f"MobSF {endpoint} answered {type(data).__name__}, not an object")
              return data


          def counts(report: dict) -> tuple:
              """(findings, severe): MobSF's own scorecard, high and warning, and high."""
              appsec = report.get("appsec") if isinstance(report.get("appsec"), dict) else {}
              high = len(appsec.get("high") or [])
              return high + len(appsec.get("warning") or []), high


          DEBUG_BUILD_WARNING = (
              "{app} is a debug build: what only a debug build has (android:debuggable, the debug certificate, "
              "LeakCanary, the Compose preview activity) is reported as findings of the app. Scan the release build "
              "(./gradlew assembleRelease or bundleRelease) or the source instead."
          )


          def is_debug_build(report: dict) -> bool:
              """A built Android app with android:debuggable=true or signed with the debug certificate."""
              if str(report.get("app_type") or "").lower() not in ("apk", "aab", "apks", "xapk"):
                  return False
              manifest = report.get("manifest_analysis") if isinstance(report.get("manifest_analysis"), dict) else {}
              for finding in manifest.get("manifest_findings") or []:
                  if isinstance(finding, dict) and "android:debuggable=true" in str(finding.get("title") or ""):
                      return True
              certificate = report.get("certificate_analysis") if isinstance(report.get("certificate_analysis"), dict) else {}
              for finding in certificate.get("certificate_findings") or []:
                  if isinstance(finding, list) and any("debug certificate" in str(part).lower() for part in finding):
                      return True
              return False


          # --- main ------------------------------------------------------------------------------


          def resolve(root: Path, apps: List[str], sources: List[str], app_root: Optional[Path] = None) -> List[Target]:
              targets = [resolve_app(app_root or root, a) for a in apps if a.strip()]
              targets += [resolve_source(root, s) for s in sources if s.strip()]
              names = [t.report_name for t in targets]
              duplicate = next((n for n in names if names.count(n) > 1), None)
              if duplicate:
                  raise MobSFError(f"Two inputs would both write {duplicate}; give them distinct paths.")
              return targets


          def split_lines(values: Optional[List[str]]) -> List[str]:
              """Repeated arguments and newline-separated ones (a multi-line CI input) alike."""
              lines: List[str] = []
              for value in values or []:
                  lines += [line.strip() for line in value.splitlines() if line.strip() and not line.strip().startswith("#")]
              return lines


          def scan(
              root: Path,
              out: Path,
              apps: List[str],
              sources: List[str],
              image: str = MOBSF_IMAGE,
              start_timeout: int = START_TIMEOUT,
              log: Callable[[str], None] = _log,
              run: Runner = _run,
              app_root: Optional[Path] = None,
              name: str = "",
          ) -> List[dict]:
              """Analyses every target; returns one row per target: label, report, findings, severe, error."""
              targets = resolve(root, apps, sources, app_root)
              if not targets:
                  raise MobSFError("Nothing to analyse: give --app or --source.")
              if shutil.which("docker") is None and run is _run:
                  raise MobSFError("MobSF runs in Docker, and the docker command is not available here.")
              out.mkdir(parents=True, exist_ok=True)
              rows: List[dict] = []
              mobsf = MobSF(image, run=run, log=log, name=name)
              with tempfile.TemporaryDirectory(prefix="tdxguard-mobsf-") as temporary:
                  try:
                      log(f"Starting MobSF ({image}); MobSF downloads its decompiler first, which takes one to three minutes.")
                      started = time.monotonic()
                      mobsf.start(start_timeout)
                      mobsf.isolate()
                      log(f"MobSF is up after {round(time.monotonic() - started)}s; its network is cut.")
                      for target in targets:
                          row = {"label": f"MobSF ({target.kind}: {target.argument})", "report": target.report_name}
                          try:
                              path = target.path
                              if target.kind == "source":
                                  path = Path(temporary) / f"{target.slug}.zip"
                                  left_out: List[str] = []
                                  files = zip_source(target.path, path, left_out)
                                  log(f"Zipped the {target.platform} project {target.argument}: {files} files.")
                                  if left_out:
                                      row["warning"] = (
                                          f"Left out of the {target.platform} source {len(left_out)} property list(s) that do "
                                          f"not parse, which MobSF fails on: {', '.join(left_out[:5])}. Fix or delete them."
                                      )
                                      log(f"WARNING: {row['warning']}")
                              begun = time.monotonic()
                              report = mobsf.analyse(path, out / target.report_name)
                              row["findings"], row["severe"] = counts(report)
                              if is_debug_build(report):
                                  row["warning"] = DEBUG_BUILD_WARNING.format(app=target.argument)
                                  log(f"WARNING: {row['warning']}")
                              log(
                                  f"{target.report_name}: {report.get('app_type')} analysed in "
                                  f"{round(time.monotonic() - begun)}s, {row['findings']} findings ({row['severe']} high)."
                              )
                          except (MobSFError, OSError, subprocess.TimeoutExpired) as e:
                              row["error"] = str(e)
                              if target.kind == "source" and target.platform == "ios" and "could not analyse" in str(e):
                                  row["error"] = IOS_SOURCE_FAILED.format(source=target.argument, error=e)
                              log(f"ERROR: {target.argument}: {row['error']}")
                          rows.append(row)
                  finally:
                      mobsf.stop()
              return rows


          def main(argv: Optional[List[str]] = None) -> int:
              parser = argparse.ArgumentParser(prog="mobsf-scan.py", description=__doc__.split("\n\n")[0])
              parser.add_argument("--root", default=".", help="the repository root (default: .)")
              parser.add_argument("--out", required=True, help="the directory the reports are written to")
              parser.add_argument("--app", action="append", help="a built app (.apk/.aab/.ipa), relative to the root")
              parser.add_argument("--source", action="append", help="android[:DIR] or ios[:DIR], a project to zip and analyse")
              parser.add_argument("--app-root", help="where the --app paths start (default: the root)")
              parser.add_argument("--name", default="", help="the container's name (default: random)")
              parser.add_argument("--image", default=MOBSF_IMAGE, help=f"the MobSF image (default: {MOBSF_IMAGE})")
              parser.add_argument("--start-timeout", type=int, default=START_TIMEOUT, help="seconds to wait for MobSF to start")
              args = parser.parse_args(argv)
              try:
                  rows = scan(
                      Path(args.root).resolve(),
                      Path(args.out),
                      split_lines(args.app),
                      split_lines(args.source),
                      image=args.image,
                      start_timeout=args.start_timeout,
                      app_root=Path(args.app_root).resolve() if args.app_root else None,
                      name=args.name,
                  )
              except MobSFError as e:
                  print(f"ERROR: {e}", file=sys.stderr)
                  return 2
              return 1 if any(row.get("error") for row in rows) else 0


          if __name__ == "__main__":
              sys.exit(main())
          TDXGUARD_SCRIPT_EOF
          cat > tdxguard-lib.sh <<'TDXGUARD_SCRIPT_EOF'
          #!/usr/bin/env bash
          # tdxguard-lib.sh — the steps every scan job shares, sourced rather than executed:
          #
          #     . ./tdxguard-lib.sh
          #     tg_push  <report> [form-field ...]            push one report to TDxGuard
          #     tg_row   <label> <report> <jq-all> <jq-severe> add one row to the run's summary
          #     tg_finish                                      emit the rows, fail if a push failed
          #
          # Each scan job pushes its own reports. They used to travel to the publish job as
          # artifacts, and artifacts count against the organisation's storage quota: when another
          # workflow's builds filled it, upload-artifact failed in the tools job and with it every
          # scan of every product, although nothing was wrong with the scans. Pushing from where a
          # report is produced needs no storage at all, and the summary rows travel as job outputs.
          #
          # Expects PRODUCT, BAO_ADDR and BAO_ROLE in the environment, and the job's id-token
          # permission (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN).

          # jq filters for the summary counts, per report format.
          TG_SARIF_ALL='[.runs[].results[]] | length'
          TG_SARIF_ERR='[.runs[].results[] | select(.level=="error")] | length'
          # Opengrep leaves result.level empty and carries severity on the rule, so its ERROR count
          # joins each result back to its rule's defaultConfiguration.level.
          TG_OPENGREP_ERR='[.runs[] | .tool.driver.rules as $r | .results[] | .ruleId as $id | select($r[] | select(.id==$id and .defaultConfiguration.level=="error"))] | length'
          TG_CDX_ALL='[.vulnerabilities[]?] | length'
          TG_CDX_SEV='[.vulnerabilities[]? | select(any(.ratings[]?; (.severity|ascii_downcase) as $s | $s=="critical" or $s=="high"))] | length'
          TG_ZEN_ALL='[.events[] | select(.type=="detected_attack")] | length'
          TG_ZAP_ALL='[.site[]?.alerts[]?] | length'
          TG_ZAP_SEV='[.site[]?.alerts[]? | select(.riskcode=="3" or .riskcode=="4")] | length'
          # MobSF's own scorecard: high and warning findings, and the high ones.
          TG_MOBSF_ALL='[.appsec.high[]?, .appsec.warning[]?] | length'
          TG_MOBSF_SEV='[.appsec.high[]?] | length'

          TG_FAILED=0
          TG_ROWS=""

          # Trade the job's OIDC identity for a short-lived OpenBao token and read the SecObserve
          # credentials with it. Once per job; the values are masked before they are kept.
          tg_login() {
            [ -n "${SECOBSERVE_URL:-}" ] && return 0
            local jwt bao_token resp
            jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')
            bao_token=$(curl -sS -X POST -d "{\"jwt\":\"$jwt\",\"role\":\"$BAO_ROLE\"}" \
              "$BAO_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token')
            if [ "$bao_token" = "null" ] || [ -z "$bao_token" ]; then
              echo "::error::Could not trade the OIDC token for an OpenBao one. Check bao_role and the id-token: write permission."
              return 1
            fi
            echo "::add-mask::$bao_token"
            resp=$(curl -sS -H "X-Vault-Token: $bao_token" "$BAO_ADDR/v1/secret/data/tdxguard/ci")
            SECOBSERVE_URL=$(echo "$resp" | jq -r '.data.data.SECOBSERVE_URL')
            SECOBSERVE_API_TOKEN=$(echo "$resp" | jq -r '.data.data.SECOBSERVE_API_TOKEN')
            echo "::add-mask::$SECOBSERVE_API_TOKEN"
            if [ "$SECOBSERVE_URL" = "null" ] || [ "$SECOBSERVE_API_TOKEN" = "null" ]; then
              echo "::error::OpenBao returned no SecObserve credentials for role $BAO_ROLE."
              SECOBSERVE_URL=""
              return 1
            fi
          }

          # tg_push <report> [form-field ...]: a missing report is skipped (that scanner did not
          # run), a failed upload is counted and fails the job in tg_finish — a scan whose results
          # never reach the dashboard must not end green.
          tg_push() {
            local file="$1" code n i
            shift
            [ -f "$file" ] || return 0
            if ! tg_login; then
              TG_FAILED=$((TG_FAILED + 1))
              return 0
            fi
            # Put -F in front of every field while KEEPING the spaces inside its value
            # ("parser_name=Aikido Zen"): each round appends "-F <field>" and drops the field at
            # the front.
            n=$#
            i=0
            while [ "$i" -lt "$n" ]; do
              set -- "$@" -F "$1"
              shift
              i=$((i + 1))
            done
            # No -f: it hides the response body, and the body is where the reason lives. A product
            # name the dashboard does not know answers 400 and says so.
            code=$(curl -sS -o "$RUNNER_TEMP/tdxguard-response" -w '%{http_code}' -X POST \
              "$SECOBSERVE_URL/api/import/file_upload_observations_by_name/" \
              -H "Authorization: APIToken $SECOBSERVE_API_TOKEN" \
              -F "file=@$file" \
              -F "product_name=$PRODUCT" \
              -F "branch_name=$GITHUB_REF_NAME" \
              "$@" 2>/dev/null) || code="000"
            case "$code" in
              2*) echo "  pushed: $file" ;;
              *)  echo "::error::Could not push $file — HTTP $code: $(head -c 300 "$RUNNER_TEMP/tdxguard-response" 2>/dev/null)"
                  echo "::error::HTTP 400 usually means the product name is not registered in the dashboard."
                  TG_FAILED=$((TG_FAILED + 1)) ;;
            esac
          }

          # tg_row <label> <report> <jq-all> <jq-severe>: one row of the pull request summary.
          tg_row() {
            [ -f "$2" ] || return 0
            local all severe
            all=$(jq "$3" "$2" 2>/dev/null || echo "-")
            severe=$(jq "$4" "$2" 2>/dev/null || echo "-")
            TG_ROWS="${TG_ROWS}| $1 | $all | $severe |"$'\n'
          }

          # The rows go to the publish job as a job output; a random delimiter keeps a label from
          # ending the value early.
          tg_finish() {
            local delimiter
            delimiter="TDXGUARD_ROWS_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "rows<<$delimiter"; printf '%s' "$TG_ROWS"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
            if [ "$TG_FAILED" -gt 0 ]; then
              echo "::error::$TG_FAILED report(s) did not reach TDxGuard."
              return 1
            fi
          }
          TDXGUARD_SCRIPT_EOF
          python3 -m py_compile sarif-enrich.py zen-collector.py opengrep-prune-rules.py mobsf-scan.py
          bash -n tdxguard-lib.sh
      # The scripts reach the other jobs as a job output, not as an artifact. Artifacts
      # count against the organisation's storage quota, and when another workflow's builds
      # filled it, this upload failed and took every scan of every product down with it.
      # Compressed, the five scripts are a few kilobytes; a job output holds up to 1 MB.
      - name: Hand the scripts to the other jobs
        id: bundle
        run: |
          echo "value=$(tar czf - sarif-enrich.py zen-collector.py opengrep-prune-rules.py mobsf-scan.py tdxguard-lib.sh | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"

  betterleaks:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
    env:
      BETTERLEAKS_VERSION: "1.8.1"
      # The severe secrets: all of them but a Firebase app's client key, which ships in the
      # app by design (FIREBASE_CONFIG_PATTERN in cli/tdxguard/engine/scan.py; a test fails
      # when they differ). It is still pushed to TDxGuard, as Low.
      SECRETS_SEVERE: '[.[]? | select((.RuleID == "gcp-api-key" and (.File | test("(?:^|/)(?:google-services\\.json|GoogleService-Info\\.plist|firebase_options[^/]*\\.dart)$"))) | not)] | length'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"

      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in git curl tar jq sha256sum; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      # The static binary, not the container image. Betterleaks used to run as a sibling
      # container with the workspace bind-mounted, and the Docker daemon resolves that
      # path on the HOST — so on a containerised runner the mount arrived empty and the
      # scan read nothing. A binary on the runner has no such gap between what the job
      # checked out and what the scanner sees.
      - name: Fetch Betterleaks (pinned binary)
        run: |
          # Fail here, with a sentence, rather than three steps later with exit 126 and
          # "cannot execute binary file". These are Linux static binaries; a macOS runner
          # accepts an untyped `self-hosted` job and then cannot run them. runs_on now
          # defaults to `Linux`, so this is the second line of defence for a caller that
          # overrode it.
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::This job needs a Linux runner; $RUNNER_NAME reports $(uname -s). Set runs_on to a Linux label."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64)        ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::Betterleaks publishes no binary for $(uname -m)"; exit 1 ;;
          esac
          BASE="https://github.com/betterleaks/betterleaks/releases/download/v$BETTERLEAKS_VERSION"
          TARBALL="betterleaks_${BETTERLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          # --retry-all-errors (curl 7.71+) also retries a connection reset mid-transfer,
          # but some self-hosted runners ship an older curl that rejects the option
          # outright (exit 2, nothing downloaded). Use it only where curl knows it.
          RETRY_ALL=; curl -s --retry-all-errors -o /dev/null file:///dev/null 2>/dev/null && RETRY_ALL=--retry-all-errors
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL"
          # Verify the checksum the release publishes. Without it a truncated or swapped
          # download becomes a scan that quietly finds nothing, which is the failure mode
          # this whole job is meant to avoid.
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/checksums.txt" "$BASE/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $TARBALL$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # IMPORTANT: scan only the NEW COMMITS, never the whole history.
      # Git history is immutable: a repository that ever had a finding (a false positive
      # included) stays RED forever if everything is scanned -> the team turns the scan
      # off. A secret that made it into the history is handled by ROTATING it, not by a
      # CI gate.
      - name: Determine the range to scan
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            # `before` is not always a commit this clone has: a force push leaves it
            # pointing at history that no longer exists, and the range then fails with
            # "Invalid revision range" — which betterleaks reports as a scan failure
            # rather than as the bad input it is. Branch renames and garbage collection
            # do the same. Check the object is really here before trusting it.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              # new branch or very first commit: scan the last commit only
              RANGE=$(git rev-parse HEAD~1 >/dev/null 2>&1 && echo "HEAD~1..HEAD" || echo "HEAD")
            else
              RANGE="$BEFORE..HEAD"
            fi
          fi
          echo "value=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Scanning range: $RANGE"

      # Betterleaks writes the native JSON array [{RuleID, Match, Secret, ...}] that
      # SecObserve's "Betterleaks" parser reads directly (parser_name=Betterleaks) — no
      # SARIF detour. It reads the same .gitleaks.toml config as gitleaks (same author),
      # honouring -c / GITLEAKS_CONFIG. --redact keeps the secret out of the logs.
      #
      # No code-scanning upload for secrets on purpose: a committed secret is a hard gate
      # failure with a clear message, and rendering its location in the Security tab adds
      # little while surfacing where the secret sits.
      - name: Scan for committed secrets (new commits only)
        env:
          # For a repository without a config of its own: the default rules, minus the
          # third-party code a dependency manager checked out into the repository. Its
          # sample keys are the vendor's, not the product's. The same text as
          # BETTERLEAKS_DEFAULT_CONFIG in cli/tdxguard/engine/scan.py (a test fails when
          # they differ).
          BETTERLEAKS_DEFAULT_CONFIG: |
            [extend]
            useDefault = true

            [[allowlists]]
            description = "Vendored third-party code"
            paths = ['''(?:^|/)(?:node_modules|bower_components|vendor|Pods|Carthage)/''']

            [[allowlists]]
            description = "Lockfiles: checksums, not keys"
            targetRules = ["generic-api-key"]
            paths = ['''(?:^|/)(?:Podfile\.lock|pubspec\.lock|Package\.resolved|Cargo\.lock|go\.sum|composer\.lock|Gemfile\.lock|gradle\.lockfile|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Pipfile\.lock|packages\.lock\.json)$''']
        run: |
          # An `if`, not `[ -f x ] && ...`: the && form returns 1 when the file is
          # absent, and the step runs under `bash -e`. Most repositories have no
          # .gitleaks.toml, so the && form failed the job for nearly everyone.
          # Betterleaks finds a .betterleaks.toml by itself, and BETTERLEAKS_CONFIG_TOML
          # would take precedence over it, hence the second test.
          CFG=""
          if [ -f .gitleaks.toml ]; then
            CFG="-c .gitleaks.toml"
          elif [ ! -f .betterleaks.toml ]; then
            export BETTERLEAKS_CONFIG_TOML="$BETTERLEAKS_DEFAULT_CONFIG"
          fi
          # The GIT_CONFIG safe.directory dance that used to be here is gone with the
          # container: the scan and the checkout now run as the same user, so git has no
          # reason to call the repository dubious and refuse to read it.
          betterleaks git . \
            --log-opts="${{ steps.range.outputs.value }}" \
            $CFG \
            -f json -r betterleaks.json \
            --exit-code 0 --redact --no-banner
      # Each job pushes its own reports; see tdxguard-lib.sh for why there are no artifacts.
      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
        run: |
          . "$TG/tdxguard-lib.sh"
          # Pushed also when clean (null or []): without it TDxGuard cannot tell a product
          # scanned clean from one never scanned for secrets. TDxGuard records the run and
          # leaves the open secrets alone, because an empty new-commit scan does not mean an
          # old secret in the history is gone (rotate it, then close the finding).
          tg_push betterleaks.json "parser_name=Betterleaks"
          tg_row "Betterleaks (secrets)" betterleaks.json length "$SECRETS_SEVERE"
          tg_finish

      - name: Fail on committed secrets
        if: inputs.fail_on_critical
        run: |
          # 0 from both shapes a clean scan produces, [] and null.
          COUNT=$(jq "$SECRETS_SEVERE" betterleaks.json)
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Found $COUNT committed secret(s). Details in TDxGuard."
            exit 1
          fi

  # Opengrep — the LGPL fork of Semgrep. We moved off Semgrep because its rule registry
  # (the p/* packs) carries usage restrictions for a security product shipped to clients;
  # Opengrep's engine and rules stay cleanly open. Same rule syntax, same SARIF output.
  #
  # Opengrep ships no Docker image, so the pinned binary and rules are downloaded. The
  # rules are pinned to a commit (opengrep-rules has no release tags). --config points at
  # the per-language directories; pointing it at the whole tree trips over a few invalid
  # community rule files and silently returns nothing.
  opengrep:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
    env:
      OPENGREP_VERSION: "1.29.0"
      OPENGREP_RULES_SHA: "f1d2b562b414783763fd02a6ed2736eaed622efa"
      # The opengrep-rules languages whose security/ rules are loaded, and the rule-id roots
      # sarif-enrich.py trims to. The same list as RULE_LANGUAGES in the CLI
      # (cli/tdxguard/engine/tools.py, where the reasons for what is left out are); a test
      # fails when they differ. Infrastructure as code (terraform, yaml, dockerfile) is
      # Trivy's job, not Opengrep's.
      OPENGREP_RULE_LANGUAGES: "python javascript typescript go generic php java kotlin scala ruby csharp c"
    steps:
      - uses: actions/checkout@v7
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"
      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in curl tar python3 jq; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi
      - name: Fetch Opengrep and its rules (pinned)
        run: |
          # Fail here, with a sentence, rather than at the scan step with exit 126 and
          # "cannot execute binary file". See the betterleaks job for the measurement that
          # made this worth a guard.
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::This job needs a Linux runner; $RUNNER_NAME reports $(uname -s). Set runs_on to a Linux label."
            exit 1
          fi
          # The asset name used to be hardcoded to _x86, which was a second way into the
          # same exit 126: an arm64 Linux runner is a perfectly valid `Linux` runner and
          # could not run the binary it was handed.
          case "$(uname -m)" in
            x86_64)        OGARCH=x86 ;;
            aarch64|arm64) OGARCH=aarch64 ;;
            *) echo "::error::Opengrep publishes no binary for $(uname -m)"; exit 1 ;;
          esac
          # Only where curl knows it; see the betterleaks download.
          RETRY_ALL=; curl -s --retry-all-errors -o /dev/null file:///dev/null 2>/dev/null && RETRY_ALL=--retry-all-errors
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o opengrep \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_${OGARCH}"
          chmod +x opengrep
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o rules.tar.gz \
            "https://github.com/opengrep/opengrep-rules/archive/${OPENGREP_RULES_SHA}.tar.gz"
          # The rules land inside the workspace because the rule ids Opengrep emits carry
          # the --config path, and the enrich step trims them by that root. They must
          # therefore be excluded from the scan below: the rulebook is full of
          # deliberately vulnerable example snippets, and scanning it turns every example
          # into a finding. On the first real run that was 5118 of 6766 results — 75%
          # noise, all of it the scanner reporting on its own rulebook.
          mkdir -p ogrules && tar xzf rules.tar.gz -C ogrules --strip-components=1

          # Keep the SECURITY rules and nothing else.
          #
          # opengrep-rules is laid out <language>/<framework>/<category>/<rule>.yaml, and
          # the categories are security, best-practice, correctness, maintainability,
          # portability and performance. Pointing --config at a whole language directory
          # loads every one of them. That is how the dashboard came to hold 110,936
          # Opengrep findings across eleven products, of which 84% were not security at
          # all -- 60% were `portability`, i18next reporting that a JSX string has not
          # been translated yet. Nobody triages a list like that, and a list nobody
          # triages protects nothing.
          #
          # Measured on tdx-guard's frontend, same excludes, same pinned rule commit:
          # 501 findings before, 2 after, and both survivors are the two real security
          # findings. Nothing security-related is lost, because the filter keys on the
          # category DIRECTORY rather than on severity.
          #
          # Secrets are Betterleaks' job -- against new commits only, which whole-tree rule
          # matching can never be. generic/secrets/security is a security/ directory all
          # the same, so it is removed after the copy: it reported every secret a second
          # time (20 of 21 SAST findings on a Flutter app were its Firebase keys again).
          # The same list as OPENGREP_SKIPPED_RULES in cli/tdxguard/engine/scan.py.
          mkdir -p ogrules-security
          for LANGUAGE in $OPENGREP_RULE_LANGUAGES; do
            if [ ! -d "ogrules/$LANGUAGE" ]; then
              echo "::error::opengrep-rules has no $LANGUAGE directory; the ruleset layout changed."
              exit 1
            fi
            while IFS= read -r RULE_DIR; do
              DEST="ogrules-security/${RULE_DIR#ogrules/}"
              mkdir -p "$(dirname "$DEST")"
              cp -R "$RULE_DIR" "$DEST"
            done < <(find "ogrules/$LANGUAGE" -type d -name security)
          done
          rm -rf ogrules-security/generic/secrets

          # Fail loudly rather than scan with an empty ruleset. A zero-rule scan exits 0
          # and reports nothing, which is indistinguishable from clean code -- the exact
          # failure this pipeline has been bitten by before. The total (about 930 at the
          # pinned commit) catches a ruleset that came out near-empty, the per-language
          # count a language that lost its rules while the others kept theirs.
          RULE_COUNT=$(find ogrules-security -name "*.yaml" | wc -l)
          echo "security rules loaded: $RULE_COUNT"
          if [ "$RULE_COUNT" -lt 100 ]; then
            echo "::error::Only $RULE_COUNT security rules found; the ruleset layout changed."
            exit 1
          fi
          for LANGUAGE in $OPENGREP_RULE_LANGUAGES; do
            if [ -z "$(find "ogrules-security/$LANGUAGE" -name '*.yaml' 2>/dev/null | head -n 1)" ]; then
              echo "::error::No security rules for $LANGUAGE; the ruleset layout changed."
              exit 1
            fi
          done

          # Then confine the few framework rules that match a bare method name to the
          # subprojects that declare the framework. python/django's avoid-query-set-extra
          # is `$X.extra(...)`: in tdx-agent, a FastAPI service, it reported 442 calls to an
          # audit helper named `extra`, while in tda-plane's Django API the same rule is
          # right. Every other rule is left alone; see opengrep-prune-rules.py for the list
          # and the measurements behind it.
          python3 "$TG/opengrep-prune-rules.py" ogrules-security . ogrules
      # Scan "." from the repo root so the file paths in the SARIF stay relative and the
      # source links in TDxGuard resolve. Opengrep then prefixes each rule id with the
      # --config path; the next step trims that.
      # *.md and *.example are excluded because several security rules are plain regexes
      # (detect-insecure-websocket is `languages: [regex]`, pattern `\bws:\/\/`), so they
      # match prose and sample files as readily as code. Every one of the twelve findings
      # this removes from tdx-scribe was `ws://` inside a README, a deployment guide or a
      # .env.example -- and all twelve were ERROR severity, so they were gate material for
      # documentation. Measured: 604 -> 592 findings, ERROR 80 -> 68.
      #
      # Secrets are not lost with them: Betterleaks reads every file type, including
      # markdown, and does it against new commits where a leak actually matters.
      - name: Scan the source code (SAST)
        run: |
          ./opengrep scan --sarif --output opengrep.sarif --quiet \
            --config ogrules-security \
            --exclude=node_modules --exclude=bower_components --exclude=vendor \
            --exclude=Pods --exclude=Carthage --exclude=.venv \
            --exclude=dist --exclude=build \
            --exclude='*.md' --exclude='*.example' \
            --exclude=ogrules --exclude=ogrules-security . || true
      # SecObserve uses the rule id as the finding title, and Opengrep's id carries the
      # --config path ("ogrules.python.<rule>"). --rule-roots trims it to "python.<rule>".
      # (Opengrep already embeds region.snippet, so this only rewrites the ids.)
      - name: Clean up Opengrep rule ids
        run: |
          python3 "$TG/sarif-enrich.py" opengrep.sarif . --rule-roots "${OPENGREP_RULE_LANGUAGES// /,}" --context 5 --expand-context
      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
        run: |
          . "$TG/tdxguard-lib.sh"
          # parser_name is stated explicitly: several parsers accept a SARIF file, and they
          # are tried in alphabetical order.
          tg_push opengrep.sarif "parser_name=SARIF"
          tg_row "Opengrep (SAST)" opengrep.sarif "$TG_SARIF_ALL" "$TG_OPENGREP_ERR"
          tg_finish
      # Inline annotations on the pull request diff and the Security tab.
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && inputs.code_scanning && hashFiles('opengrep.sarif') != ''
        continue-on-error: true
        with: { sarif_file: opengrep.sarif, category: tdxguard-opengrep }

      - name: Fail on ERROR severity findings
        if: inputs.fail_on_critical
        run: |
          ./opengrep scan --error --severity=ERROR --quiet \
            --config ogrules-security \
            --exclude=node_modules --exclude=bower_components --exclude=vendor \
            --exclude=Pods --exclude=Carthage --exclude=.venv \
            --exclude=dist --exclude=build \
            --exclude='*.md' --exclude='*.example' \
            --exclude=ogrules --exclude=ogrules-security . \
            || { echo "::error::Opengrep: ERROR severity findings present."; exit 1; }

  trivy:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
      image_hint: ${{ steps.dockerfiles.outputs.hint }}
    env:
      TRIVY_VERSION: "0.74.0"
    steps:
      - uses: actions/checkout@v7
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"

      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in curl tar python3 sha256sum jq; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      # Trivy as a pinned binary rather than aquasec/trivy with the workspace bind-mounted.
      # The mount was the bug: the Docker daemon resolves `-v "$PWD:/src"` on the HOST, so
      # on a containerised runner trivy received an empty directory, found nothing in it,
      # and exited 0 — "Number of language-specific files num=0" and a green pipeline that
      # had not read a line of the code.
      #
      # 0.58.1 is not the pinned version any more: Aqua has deleted the release assets for
      # it, so there is no binary left to download. 0.74.0 is the version this was verified
      # against — SARIF and CycloneDX both parse, and CycloneDX 1.7 is accepted (SecObserve
      # keys off bomFormat, not the spec version).
      - name: Fetch Trivy (pinned binary)
        run: |
          # Linux-only static binaries; see the betterleaks job for why this guard exists.
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::This job needs a Linux runner; $RUNNER_NAME reports $(uname -s). Set runs_on to a Linux label."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64)        ARCH=64bit ;;
            aarch64|arm64) ARCH=ARM64 ;;
            *) echo "::error::Trivy publishes no binary for $(uname -m)"; exit 1 ;;
          esac
          BASE="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          TARBALL="trivy_${TRIVY_VERSION}_Linux-${ARCH}.tar.gz"
          # Only where curl knows it; see the betterleaks download.
          RETRY_ALL=; curl -s --retry-all-errors -o /dev/null file:///dev/null 2>/dev/null && RETRY_ALL=--retry-all-errors
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/trivy-checksums.txt" "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $TARBALL$" trivy-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Trivy's SARIF carries ONLY the misconfigurations (IaC). The vulnerabilities travel
      # through CycloneDX instead.
      #
      # SARIF is a SAST format: it has no place for a package, a version, a CVSS score or a
      # CVE. SecObserve's SARIF parser only extracts vulnerability_id for Dependency-Check,
      # so Trivy's ruleId = CVE-xxxx is dropped -> the finding lands in the database with an
      # empty vulnerability_id, no CVSS, no EPSS and no component.
      # A repository that has a Dockerfile but declares neither dockerfile nor image_ref ships
      # an image nobody scans: the CVEs of its base image and of the OS packages installed
      # into it never reach TDxGuard, and `trivy fs .` on the source cannot see them. Say so
      # where people look, the job summary and the pull request comment. A warning only.
      - name: Look for a Dockerfile without an image scan
        id: dockerfiles
        if: inputs.dockerfile == '' && inputs.image_ref == ''
        run: |
          # The same pattern TDxGuard uses on the IaC findings; at most three names, and only
          # characters that cannot form a workflow command.
          FOUND=$(git ls-files | grep -iE '(^|/)[^/]*(dockerfile|containerfile)[^/]*$' \
            | grep -viE '\.dockerignore$' | head -3 | tr -cd 'A-Za-z0-9._/\n-' | paste -sd, - | sed 's/,/, /g')
          if [ -n "$FOUND" ]; then
            MSG="Dockerfile found ($FOUND), but no container image is scanned. Set dockerfile: (built and scanned in this run, never pushed) or image_ref: in the TDxGuard workflow to scan the base image and the OS packages."
            echo "::warning::$MSG"
            { echo "> [!WARNING]"; echo "> $MSG"; } >> "$GITHUB_STEP_SUMMARY"
            echo "hint=$MSG" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan dependencies and infrastructure
        run: |
          trivy fs . --scanners misconfig --format sarif --output trivy.sarif \
            --skip-dirs '**/node_modules' --skip-dirs '**/bower_components' --skip-dirs '**/vendor' \
            --skip-dirs '**/Pods' --skip-dirs '**/Carthage' --skip-dirs .venv
      # CycloneDX carries BOTH the components AND the vulnerabilities, so this single file
      # replaces what used to be two paths (a separate SBOM plus an OSV scan for the CVEs).
      # Dropping "--scanners vuln" silently turns the vulnerability scan off — Trivy warns
      # about it, but still writes a perfectly valid file.
      - name: Generate the SBOM including vulnerabilities
        run: |
          trivy fs . --format cyclonedx --scanners vuln --output sbom.cdx.json \
            --skip-dirs '**/node_modules' --skip-dirs '**/bower_components' --skip-dirs '**/vendor' \
            --skip-dirs '**/Pods' --skip-dirs '**/Carthage' --skip-dirs .venv
      # Trivy reports line numbers but no code snippet, so the enrich step embeds one.
      #
      # --unescape-html is kept for the older-Trivy case only: 0.58.x rendered its SARIF
      # through html/template and a title arrived as "&#39;apt-get&#39; missing ...".
      # 0.74.0 does not, and unescaping text that holds no entities changes nothing.
      #
      # The `sudo chown` that used to stand here is gone with the container: trivy ran as
      # root inside it and left root-owned files that this step could not rewrite. It also
      # assumed a passwordless sudo, which a self-hosted runner does not owe anyone.
      - name: Normalize the SARIF (unescape HTML, embed snippets)
        run: |
          python3 "$TG/sarif-enrich.py" trivy.sarif . --unescape-html
      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
          # true on a pull request unless sbom_on_pull_requests: the CVEs are imported, the
          # components and licenses are not.
          SUPPRESS_LICENSES: ${{ startsWith(github.event_name, 'pull_request') && !inputs.sbom_on_pull_requests }}
        run: |
          . "$TG/tdxguard-lib.sh"
          tg_push trivy.sarif "parser_name=SARIF"
          # One upload of Trivy's CycloneDX yields both the CVEs and the components: the
          # observations endpoint handles both, so file_upload_sbom_by_name is not needed.
          tg_push sbom.cdx.json "parser_name=CycloneDX" "suppress_licenses=$SUPPRESS_LICENSES"
          tg_row "Trivy (IaC)" trivy.sarif "$TG_SARIF_ALL" "$TG_SARIF_ERR"
          tg_row "Trivy (dependencies)" sbom.cdx.json "$TG_CDX_ALL" "$TG_CDX_SEV"
          tg_finish
      # Inline annotations on the pull request diff and the Security tab. The findings
      # already travel to TDxGuard; this only puts them where the developer is looking.
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && inputs.code_scanning && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with: { sarif_file: trivy.sarif, category: tdxguard-trivy }

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        if: inputs.fail_on_critical
        run: |
          trivy fs . --scanners vuln,misconfig --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 \
            --skip-dirs '**/node_modules' --skip-dirs '**/bower_components' --skip-dirs '**/vendor' \
            --skip-dirs '**/Pods' --skip-dirs '**/Carthage' --skip-dirs .venv

  # Scan the built image — the OS packages and libraries that live INSIDE it, which
  # `trivy fs .` on the source tree never sees: a stale base image, apt/apk packages
  # carrying CVEs.
  #
  # The image SBOM is uploaded under its OWN file name (sbom-image.cdx.json). TDxGuard
  # groups components by (product, branch, upload_filename), so the source SBOM and the
  # image SBOM live side by side — under the same file name the later one wipes the
  # earlier one.
  #
  # The job runs when the project declares dockerfile (built here, scanned here, never
  # pushed) or image_ref (already in a registry). Declaring neither skips it — which is
  # why, for a long time, no project in the organisation had an image scanned at all
  # despite every one of them publishing images: image_ref was the only way in, and it
  # only works on the commits a publish pipeline has already tagged.
  image_scan:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
    if: inputs.dockerfile != '' || inputs.image_ref != ''
    env:
      TRIVY_VERSION: "0.74.0"
    steps:
      - uses: actions/checkout@v7
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"

      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in docker curl tar sha256sum jq; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      # Same pinned binary as the trivy job. Trivy talks to the Docker daemon directly,
      # so the image it inspects is the one the daemon holds, whether the runner is
      # containerised or not — no bind mount, no path to resolve on the wrong side.
      - name: Fetch Trivy (pinned binary)
        run: |
          # Linux-only static binaries; see the betterleaks job for why this guard exists.
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::This job needs a Linux runner; $RUNNER_NAME reports $(uname -s). Set runs_on to a Linux label."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64)        ARCH=64bit ;;
            aarch64|arm64) ARCH=ARM64 ;;
            *) echo "::error::Trivy publishes no binary for $(uname -m)"; exit 1 ;;
          esac
          BASE="https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION"
          TARBALL="trivy_${TRIVY_VERSION}_Linux-${ARCH}.tar.gz"
          # Only where curl knows it; see the betterleaks download.
          RETRY_ALL=; curl -s --retry-all-errors -o /dev/null file:///dev/null 2>/dev/null && RETRY_ALL=--retry-all-errors
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/trivy-checksums.txt" "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $TARBALL$" trivy-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Decide, once, which images this run scans, and write the list where the later
      # steps read it. One line per image so a project with a backend and a frontend gets
      # both — each under its own file name, since TDxGuard groups components by
      # (product, branch, upload_filename) and a shared name means the second upload
      # erases the first.
      - name: Work out which images to scan
        id: images
        env:
          DOCKERFILES: ${{ inputs.dockerfile }}
          # NOT named DOCKER_CONTEXT. That is a reserved Docker CLI variable naming the
          # daemon context to talk to, so exporting it as "." made every build fail with
          # `ERROR: no builder "." found` before it read a single line of the Dockerfile.
          BUILD_CONTEXT: ${{ inputs.docker_context }}
          DOCKER_BUILD_ARGS: ${{ inputs.docker_build_args }}
          IMAGE_REF: ${{ inputs.image_ref }}
          IMAGE_BUILD_COMMAND: ${{ inputs.image_build_command }}
        run: |
          : > images.txt
          if [ -n "$DOCKERFILES" ]; then
            # `docker build` streams its context to the daemon over the API instead of
            # asking it to open a path, so it works on a containerised runner exactly as
            # it does on a host one. This is why building here is sound where mounting
            # was not.
            # A here-string, not `printf ... | while`: a pipeline puts the loop in a
            # subshell, where the `exit 1` below would end the subshell and let the step
            # carry on reporting success for an image it never built.
            # Two fields per line: the Dockerfile, then optionally its own build context.
            # A monorepo commonly needs both — the backend builds from the root while a
            # frontend builds from the workspace subdirectory it lives in, and one shared
            # context cannot be right for both.
            # IFS is left at its default so the line splits into two fields; `IFS= read`
            # would hand the whole line, context and all, to DF. The cost is that a path
            # containing a space cannot be expressed, which is the right trade when
            # whitespace is what separates the two fields.
            while read -r DF CTX; do
              [ -n "$DF" ] || continue
              CTX="${CTX:-$BUILD_CONTEXT}"
              if [ ! -f "$DF" ]; then
                echo "::error::dockerfile not found: $DF"
                exit 1
              fi
              if [ ! -d "$CTX" ]; then
                echo "::error::build context is not a directory: $CTX (for $DF)"
                exit 1
              fi
              # One tag per Dockerfile, named after where it lives:
              #   docker/backend/Dockerfile -> docker-backend
              #   Dockerfile                -> root
              #   ./Dockerfile.prod         -> prod
              # Lowercased because Docker rejects an uppercase repository name outright
              # ("repository name must be lowercase"), which a path like Deploy/Dockerfile
              # would otherwise walk straight into.
              SLUG=$(printf '%s' "$DF" \
                | tr '[:upper:]' '[:lower:]' \
                | sed 's#^\./##; s#[^a-z0-9._-]#-#g; s#-*dockerfile##; s#^[.-]*##; s#[.-]*$##')
              [ -n "$SLUG" ] || SLUG=root
              TAG="tdxguard-scan/$SLUG:${{ github.sha }}"
              echo "Building $TAG from $DF (context $CTX)"
              # Unquoted on purpose: these are several arguments, not one.
              # shellcheck disable=SC2086
              docker build -f "$DF" -t "$TAG" $DOCKER_BUILD_ARGS "$CTX"
              printf '%s\t%s\n' "$TAG" "$SLUG" >> images.txt
            done <<< "$DOCKERFILES"
          fi
          if [ -n "$IMAGE_REF" ]; then
            if [ -n "$IMAGE_BUILD_COMMAND" ] && [ -z "$DOCKERFILES" ]; then
              sh -c "$IMAGE_BUILD_COMMAND"
            fi
            printf '%s\t%s\n' "$IMAGE_REF" "registry" >> images.txt
          fi
          echo "--- images to scan ---"
          cat images.txt

      # Two reports per image: the CycloneDX SBOM carries the components AND their CVEs
      # (the base image's OS packages, which `trivy fs .` on the source tree never sees),
      # the SARIF carries secrets baked into the layers — an .env or a private key copied
      # in during the build and not deleted.
      - name: Scan the images
        run: |
          while IFS="$(printf '\t')" read -r REF SLUG; do
            [ -n "$REF" ] || continue
            echo "::group::$REF"
            trivy image --format cyclonedx --scanners vuln \
              --output "sbom-image-$SLUG.cdx.json" "$REF"
            trivy image --scanners secret --format sarif \
              --output "trivy-image-$SLUG.sarif" "$REF"
            echo "::endgroup::"
          done < images.txt

      # Each report reaches TDxGuard tagged with the image it came from. The locally built
      # tag is the honest answer for a built image: nothing was pushed, so there is no
      # registry reference to claim.
      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
          # See the push of sbom.cdx.json in the scan job
          SUPPRESS_LICENSES: ${{ startsWith(github.event_name, 'pull_request') && !inputs.sbom_on_pull_requests }}
        run: |
          . "$TG/tdxguard-lib.sh"
          if [ -f images.txt ]; then
            while IFS="$(printf '\t')" read -r REF SLUG; do
              [ -n "$REF" ] || continue
              tg_push "trivy-image-$SLUG.sarif" "parser_name=SARIF" "docker_image_name_tag=$REF"
              tg_push "sbom-image-$SLUG.cdx.json" "parser_name=CycloneDX" "docker_image_name_tag=$REF" \
                "suppress_licenses=$SUPPRESS_LICENSES"
              # Named after the image, so a project that builds a backend and a frontend can
              # tell which one carries the findings.
              tg_row "Trivy (image \`$REF\`)" "sbom-image-$SLUG.cdx.json" "$TG_CDX_ALL" "$TG_CDX_SEV"
              tg_row "Trivy (image secrets)" "trivy-image-$SLUG.sarif" "$TG_SARIF_ALL" "$TG_SARIF_ALL"
            done < images.txt
          fi
          tg_finish

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities in the image
        if: inputs.fail_on_critical
        run: |
          while IFS="$(printf '\t')" read -r REF _; do
            [ -n "$REF" ] || continue
            trivy image --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --exit-code 1 "$REF"
          done < images.txt

      # Remove what this job built, whatever happened above — hence always(), so a failing
      # gate does not also leak an image.
      #
      # A self-hosted runner shares ONE Docker daemon with every other job on that host,
      # and these tags carry the commit SHA, so no later run ever reuses one. Left behind
      # they accumulate at one image per Dockerfile, per push, per project, without limit.
      # Measured on the org's runner host: 22GB free of 234GB, with tdxguard-scan images
      # sitting in that total.
      #
      # Only the tags built here. An entry marked `registry` came from image_ref: it was
      # pulled, not built, and may be a base image other jobs on the host are using.
      #
      # The layers stay in the daemon's build cache, so the next build is still fast. This
      # drops the tags, not the cache.
      - name: Remove the images this job built
        if: always()
        run: |
          [ -f images.txt ] || exit 0
          while IFS="$(printf '\t')" read -r REF SLUG; do
            if [ -z "$REF" ] || [ "$SLUG" = registry ]; then
              continue
            fi
            docker rmi -f "$REF" >/dev/null 2>&1 || true
          done < images.txt

  # IAST + DAST — start the application ONCE, collect two kinds of result.
  #
  # Zen is an in-app firewall: it sits INSIDE the process, hooks the dangerous sinks
  # (running a SQL statement, spawning a shell, opening a file, calling out over HTTP) and
  # compares their arguments against the data of the request. It sees the final SQL string
  # and knows which part of it came from the user — what SAST has to guess with rules and
  # DAST has to guess from the outside. A Zen finding is almost always a real
  # vulnerability, with the exact line of code in its stack trace.
  #
  # ZAP works the other way around: it fires payloads from the outside and knows nothing
  # about the code. Put together, ZAP's attack traffic IS the traffic Zen observes — ZAP
  # reports "possible SQLi at /users", Zen confirms "the payload reached sqlite3.execute,
  # line 20". A blind DAST alert gets proven by evidence from the inside.
  #
  # Zen writes no file of its own, it POSTs its events to Aikido's server. We run a local
  # collector on 127.0.0.1 and point AIKIDO_ENDPOINT at it: not a byte leaves the runner,
  # and no Aikido account is needed.
  #
  # The job only runs when the project declares app_start_command.
  runtime:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
    if: inputs.app_start_command != ''
    env:
      NUCLEI_VERSION: "3.4.10"
    steps:
      - uses: actions/checkout@v7
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"

      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in python3 curl jq docker unzip; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      - name: Install the application's dependencies
        if: inputs.app_setup_command != ''
        env:
          APP_SETUP_COMMAND: ${{ inputs.app_setup_command }}
        run: sh -c "$APP_SETUP_COMMAND"

      - name: Run the application, fire ZAP at it, collect Zen's events
        env:
          # Without AIKIDO_TOKEN Zen does NOT start its background process and reports
          # nothing at all -> it has to be set, to any value (the collector ignores it).
          AIKIDO_TOKEN: tdxguard-local
          AIKIDO_ENDPOINT: http://127.0.0.1:5000/
          # Detect only, never block: blocking in CI would break the very tests being run.
          AIKIDO_BLOCK: "false"
          APP_START_COMMAND: ${{ inputs.app_start_command }}
          APP_HEALTH_URL: ${{ inputs.app_health_url }}
          TRAFFIC_COMMAND: ${{ inputs.traffic_command }}
          ZAP_TARGET: ${{ inputs.zap_target }}
          ZAP_MODE: ${{ inputs.zap_mode }}
          NUCLEI: ${{ inputs.nuclei }}
        run: |
          set -u
          python3 "$TG/zen-collector.py" --out zen.json --port 5000 --strip-prefix "$PWD" &
          COLLECTOR=$!

          sh -c "$APP_START_COMMAND" &
          APP=$!

          # Wait for the application, at most 120s.
          READY=0
          for _ in $(seq 1 60); do
            if curl -sS -o /dev/null "$APP_HEALTH_URL"; then READY=1; break; fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::warning::The application never came up at $APP_HEALTH_URL — skipping IAST and DAST."
          else
            if [ -n "$ZAP_TARGET" ]; then
              # baseline = passive (spider + look at the responses). full = active: ZAP
              # sends the payloads itself, finds far more and takes far longer.
              case "$ZAP_MODE" in
                full) ZAP_SCRIPT=zap-full-scan.py ;;
                *)    ZAP_SCRIPT=zap-baseline.py ;;
              esac
              # ZAP stays a container — it is a large Java application with no usable
              # standalone binary — but its report is fetched with `docker cp` instead of a
              # bind mount. `docker cp` goes through the API, so it does not care whose
              # filesystem $PWD names; a mount does, which is why the mounted variant read
              # and wrote nothing on a containerised runner. It also disposes of the old
              # chmod 777 workaround for ZAP running as uid 1000 against a workspace owned
              # by another uid.
              #
              # --network host: ZAP runs in a container, the application runs on the runner.
              # -I: warnings do not make ZAP exit non-zero, the gate lives in TDxGuard.
              docker rm -f tdxguard-zap >/dev/null 2>&1 || true
              docker run --name tdxguard-zap --network host \
                ghcr.io/zaproxy/zaproxy:2.16.1 \
                "$ZAP_SCRIPT" -t "$ZAP_TARGET" -J zap.json -I \
                || echo "::warning::ZAP exited with an error."
              docker cp tdxguard-zap:/zap/wrk/zap.json zap.json \
                || echo "::warning::ZAP wrote no report."
              docker rm -f tdxguard-zap >/dev/null 2>&1 || true

              if [ "$NUCLEI" = "true" ]; then
                # Nuclei writes SARIF natively (-sarif-export), so it travels the same path
                # as Opengrep and Trivy: annotations on the diff and the SARIF parser.
                # It ships no templates: they are downloaded on first run (~1 minute).
                # Do NOT add -disable-update-check, that leaves it with nothing to run.
                #
                # The pinned binary rather than the image, for the same reason as the other
                # scanners: no bind mount to resolve on the wrong host.
                #
                # Linux-only static binaries; see the betterleaks job for why this guard exists.
                if [ "$(uname -s)" != "Linux" ]; then
                  echo "::error::This job needs a Linux runner; $RUNNER_NAME reports $(uname -s). Set runs_on to a Linux label."
                  exit 1
                fi
                case "$(uname -m)" in
                  x86_64)        NARCH=amd64 ;;
                  aarch64|arm64) NARCH=arm64 ;;
                  *) echo "::error::Nuclei publishes no binary for $(uname -m)"; exit 1 ;;
                esac
                NBASE="https://github.com/projectdiscovery/nuclei/releases/download/v$NUCLEI_VERSION"
                NZIP="nuclei_${NUCLEI_VERSION}_linux_${NARCH}.zip"
                # Only where curl knows it; see the betterleaks download.
                RETRY_ALL=; curl -s --retry-all-errors -o /dev/null file:///dev/null 2>/dev/null && RETRY_ALL=--retry-all-errors
                curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/$NZIP" "$NBASE/$NZIP"
                curl -sSfL --retry 5 $RETRY_ALL --retry-delay 2 -o "$RUNNER_TEMP/nuclei-checksums.txt" \
                  "$NBASE/nuclei_${NUCLEI_VERSION}_checksums.txt"
                (cd "$RUNNER_TEMP" && grep " $NZIP$" nuclei-checksums.txt | sha256sum -c -)
                unzip -oq "$RUNNER_TEMP/$NZIP" nuclei -d "$RUNNER_TEMP"
                "$RUNNER_TEMP/nuclei" \
                  -target "$ZAP_TARGET" -severity low,medium,high,critical \
                  -sarif-export nuclei.sarif -no-interactsh -silent \
                  || echo "::warning::Nuclei exited with an error."
                if [ -f nuclei.sarif ]; then
                  # Nuclei stamps kind "open" on every match, and SecObserve imports only
                  # kind "fail" (SARIF §3.27.9). Without this the upload returns HTTP 200
                  # with zero observations — a silent loss. Verified on a real scan.
                  python3 "$TG/sarif-enrich.py" nuclei.sarif . --kind-fail
                fi
              fi
            fi
            if [ -n "$TRAFFIC_COMMAND" ]; then
              sh -c "$TRAFFIC_COMMAND" || echo "::warning::The traffic command returned an error."
            fi
            if [ -z "$ZAP_TARGET" ] && [ -z "$TRAFFIC_COMMAND" ]; then
              echo "::warning::Neither zap_target nor traffic_command is set — Zen has nothing to observe."
            fi
          fi

          # Zen reports asynchronously through its background process; give it time to flush.
          sleep 5
          kill "$APP" 2>/dev/null || true
          kill -TERM "$COLLECTOR" 2>/dev/null || true
          wait "$COLLECTOR" 2>/dev/null || true

      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
          ZAP_TARGET: ${{ inputs.zap_target }}
        run: |
          . "$TG/tdxguard-lib.sh"
          # No endpoint_url for zen.json: the parser derives one per route (/users), and
          # the form field would overwrite it with the bare target.
          tg_push zen.json "parser_name=Aikido Zen"
          tg_push zap.json "parser_name=ZAP" "endpoint_url=$ZAP_TARGET"
          tg_push nuclei.sarif "parser_name=SARIF" "endpoint_url=$ZAP_TARGET"
          tg_row "Aikido Zen (IAST)" zen.json "$TG_ZEN_ALL" "$TG_ZEN_ALL"
          tg_row "ZAP (DAST)" zap.json "$TG_ZAP_ALL" "$TG_ZAP_SEV"
          tg_row "Nuclei (DAST)" nuclei.sarif "$TG_SARIF_ALL" "$TG_SARIF_ERR"
          tg_finish

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && inputs.code_scanning && hashFiles('nuclei.sarif') != ''
        continue-on-error: true
        with: { sarif_file: nuclei.sarif, category: tdxguard-nuclei }

      - name: Fail when Zen saw an attack reach a sink
        if: inputs.zen_fail_on_attack
        run: |
          COUNT=$(jq '[.events[] | select(.type=="detected_attack")] | length' zen.json)
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Zen: user input reached a dangerous sink $COUNT time(s)."
            exit 1
          fi

  # Mobile app analysis with MobSF (Mobile Security Framework): the static analysis of an
  # Android or iOS app, the built .apk/.aab/.ipa (mobile_app) or the project's source
  # (mobile_source). The pinned official image runs as a throwaway container; mobsf-scan.py
  # drives its REST API from inside the container (docker exec), so no port is published,
  # and cuts the container's network once MobSF is up, before the app is copied in. Neither
  # the app nor anything found in it leaves the runner: MobSF's own lookups (the package name
  # on Google Play or the App Store, the Firebase and malware domain checks) are skipped.
  # The network is needed at start only, when MobSF downloads its decompiler (JADX): the job
  # takes about two minutes before the first app, and seconds to a minute per app.
  #
  # The image is 2.3 GB unpacked (arm64; about 1 GB to download). Each report is pushed as
  # mobsf-<slug>.json, the slug from the input line, so the report keeps its name from one
  # build to the next. TDxGuard files it under the kind "mobile" of the scan coverage.
  #
  # GitHub only: the GitLab template has no MobSF job, see ci-templates/README.md.
  mobile:
    runs-on: ${{ inputs.runs_on }}
    needs: [tools]
    outputs:
      rows: ${{ steps.push.outputs.rows }}
    if: inputs.mobile_app != '' || inputs.mobile_source != ''
    env:
      MOBSF_IMAGE: "opensecurity/mobile-security-framework-mobsf:v4.5.3"
    steps:
      - uses: actions/checkout@v7
      # The helper scripts from the tools job, unpacked outside the checkout so that they are
      # neither scanned as part of the product nor mistaken for its files.
      - name: Unpack the helper scripts
        env:
          BUNDLE: ${{ needs.tools.outputs.bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdxguard"
          echo "$BUNDLE" | base64 -d | tar xzf - -C "$RUNNER_TEMP/tdxguard"
          echo "TG=$RUNNER_TEMP/tdxguard" >> "$GITHUB_ENV"

      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in docker python3 curl jq; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      - name: Download the app built by an earlier job
        if: inputs.mobile_app_artifact != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.mobile_app_artifact }}
          path: ${{ runner.temp }}/tdxguard-mobile-app

      - name: Analyse the app with MobSF
        env:
          MOBILE_APP: ${{ inputs.mobile_app }}
          MOBILE_SOURCE: ${{ inputs.mobile_source }}
          MOBILE_APP_ARTIFACT: ${{ inputs.mobile_app_artifact }}
        run: |
          set -- --root . --out "$RUNNER_TEMP/mobsf" --image "$MOBSF_IMAGE" \
            --name "tdxguard-mobsf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -n "$MOBILE_APP_ARTIFACT" ]; then
            set -- "$@" --app-root "$RUNNER_TEMP/tdxguard-mobile-app"
          fi
          if [ -n "$MOBILE_APP" ]; then
            set -- "$@" --app "$MOBILE_APP"
          fi
          if [ -n "$MOBILE_SOURCE" ]; then
            set -- "$@" --source "$MOBILE_SOURCE"
          fi
          python3 "$TG/mobsf-scan.py" "$@"

      # Also when the analysis step was cancelled half-way: the container must not outlive the job.
      - name: Remove the MobSF container
        if: always()
        run: docker rm -f -v "tdxguard-mobsf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true

      - name: Push the results to TDxGuard
        id: push
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
        run: |
          . "$TG/tdxguard-lib.sh"
          for REPORT in "$RUNNER_TEMP"/mobsf/mobsf-*.json; do
            [ -f "$REPORT" ] || continue
            tg_push "$REPORT" "parser_name=MobSF"
            tg_row "MobSF ($(basename "$REPORT" .json))" "$REPORT" "$TG_MOBSF_ALL" "$TG_MOBSF_SEV"
          done
          tg_finish

  publish:
    runs-on: ${{ inputs.runs_on }}
    needs: [betterleaks, opengrep, trivy, image_scan, runtime, mobile]
    if: always()          # summarize and comment even when a scan's gate failed
    steps:
      - name: Check the runner has what this job needs
        run: |
          MISSING=""
          for T in curl jq; do
            command -v "$T" >/dev/null 2>&1 || MISSING="$MISSING $T"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner '${RUNNER_NAME:-?}' is missing:$MISSING"
            exit 1
          fi

      - name: Fetch the SecObserve token from OpenBao (no static secret)
        env:
          BAO_ADDR: ${{ inputs.bao_addr }}
          BAO_ROLE: ${{ inputs.bao_role }}
        run: |
          set -euo pipefail
          # 1) Ask GitHub Actions for its own OIDC token
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')
          # 2) Trade it for a short-lived OpenBao token
          BAO_TOKEN=$(curl -sS -X POST \
            -d "{\"jwt\":\"$JWT\",\"role\":\"$BAO_ROLE\"}" \
            "$BAO_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token')
          if [ "$BAO_TOKEN" = "null" ] || [ -z "$BAO_TOKEN" ]; then
            echo "::error::Could not trade the OIDC token for an OpenBao one. Check bao_role and the id-token: write permission."
            exit 1
          fi
          # 3) Read the SecObserve credentials
          RESP=$(curl -sS -H "X-Vault-Token: $BAO_TOKEN" \
            "$BAO_ADDR/v1/secret/data/tdxguard/ci")
          for K in SECOBSERVE_URL SECOBSERVE_API_TOKEN; do
            V=$(echo "$RESP" | jq -r ".data.data.$K")
            echo "::add-mask::$V"
            echo "$K=$V" >> "$GITHUB_ENV"
          done
          # Optional: the dashboard URL, for the deep links in the summary. Not a secret.
          UI=$(echo "$RESP" | jq -r '.data.data.SECOBSERVE_UI_URL // empty')
          echo "SECOBSERVE_UI_URL=$UI" >> "$GITHUB_ENV"

      # The scan jobs push their own reports (see tdxguard-lib.sh). What is left here is
      # what needs all of them: the summary, the pull request comment and the gate.

      # What Aikido shows on a pull request, from the reports already produced: one
      # table with the counts per scanner and a link straight into TDxGuard. Written to
      # the job summary always, and as ONE sticky comment on a pull request (updated in
      # place on every run, never a new comment each time).
      - name: Summarize the results on the pull request
        if: always()
        env:
          PRODUCT: ${{ inputs.product }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROWS_BETTERLEAKS: ${{ needs.betterleaks.outputs.rows }}
          ROWS_OPENGREP: ${{ needs.opengrep.outputs.rows }}
          ROWS_TRIVY: ${{ needs.trivy.outputs.rows }}
          ROWS_IMAGE: ${{ needs.image_scan.outputs.rows }}
          ROWS_RUNTIME: ${{ needs.runtime.outputs.rows }}
          ROWS_MOBILE: ${{ needs.mobile.outputs.rows }}
          IMAGE_HINT: ${{ needs.trivy.outputs.image_hint }}
        run: |
          set -uo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          {
            echo "### TDxGuard — \`$PRODUCT\` @ \`$BRANCH\`"
            echo
            echo "| Scanner | Findings | Severe |"
            echo "|---|---:|---:|"
            # One block of rows per scan job, computed where the report was produced.
            printf '%s' "$ROWS_BETTERLEAKS$ROWS_OPENGREP$ROWS_TRIVY$ROWS_IMAGE$ROWS_RUNTIME$ROWS_MOBILE"
            echo
            echo "_Severe = secrets, ERROR level, CRITICAL/HIGH, an attack reaching a sink, or a high MobSF finding._"
            echo
            if [ -n "${IMAGE_HINT:-}" ]; then
              echo "> [!WARNING]"
              echo "> $IMAGE_HINT"
              echo
            fi
            if [ -n "${SECOBSERVE_UI_URL:-}" ]; then
              PID=$(curl -sS -G "$SECOBSERVE_URL/api/products/" --data-urlencode "name=$PRODUCT" \
                -H "Authorization: APIToken $SECOBSERVE_API_TOKEN" \
                | jq -r --arg n "$PRODUCT" '.results[] | select(.name==$n) | .id' | head -1)
              if [ -n "$PID" ]; then
                echo "Details, triage and history: [$PRODUCT in TDxGuard]($SECOBSERVE_UI_URL/products/$PID/show)"
              else
                echo "Details in TDxGuard: $SECOBSERVE_UI_URL"
              fi
            else
              echo "Details in TDxGuard (set SECOBSERVE_UI_URL in OpenBao for a direct link)."
            fi
          } > tdxguard-summary.md

          cat tdxguard-summary.md >> "$GITHUB_STEP_SUMMARY"

          # Sticky comment: find our own earlier comment by its marker and edit it.
          #
          # curl and jq rather than the gh CLI. gh is preinstalled on GitHub-hosted runners
          # and on nobody else's, and `CID=$(gh api ...)` under `bash -e` aborts the whole
          # step when gh is missing — turning the job red AFTER every finding had already
          # been pushed to TDxGuard, which reads as "the scan failed" when it did not.
          if [ -n "${PR_NUMBER:-}" ]; then
            MARK="<!-- tdxguard-summary -->"
            { echo "$MARK"; cat tdxguard-summary.md; } > tdxguard-comment.md
            API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
            AUTH="Authorization: Bearer $GH_TOKEN"
            # -Rs makes the whole file one JSON string, escaping included; the payload goes
            # through a file because a summary can outgrow a command line argument.
            jq -Rs '{body: .}' < tdxguard-comment.md > tdxguard-comment.json
            CID=$(curl -sS -H "$AUTH" "$API/issues/$PR_NUMBER/comments?per_page=100" \
              | jq -r --arg m "$MARK" 'map(select(.body | startswith($m))) | .[0].id // empty') \
              || CID=""
            if [ -n "$CID" ]; then
              curl -sS -f -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                "$API/issues/comments/$CID" -d @tdxguard-comment.json >/dev/null \
                && echo "updated the pull request comment" \
                || echo "::warning::Could not update the pull request comment"
            else
              curl -sS -f -X POST -H "$AUTH" -H "Content-Type: application/json" \
                "$API/issues/$PR_NUMBER/comments" -d @tdxguard-comment.json >/dev/null \
                && echo "posted the pull request comment" \
                || echo "::warning::Could not post the pull request comment"
            fi
          fi

      # A gate on the THRESHOLDS IN THE DASHBOARD rather than the ones hard-coded in this
      # file. Every product has its own security_gate_threshold_critical/high/..., which
      # the security team tunes per project without touching a pipeline. TDxGuard
      # recalculates the value synchronously during the import, so reading it here gives
      # an up-to-date answer.
      #
      # security_gate_passed: null = gate disabled, true = passed, false = failed.
      - name: Check the product's security gate
        if: inputs.security_gate
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          set -uo pipefail
          PASSED=$(curl -sS -G "$SECOBSERVE_URL/api/products/" --data-urlencode "name=$PRODUCT" \
            -H "Authorization: APIToken $SECOBSERVE_API_TOKEN" \
            | jq -r --arg n "$PRODUCT" '.results[] | select(.name==$n) | .security_gate_passed' | head -1)
          case "$PASSED" in
            null) echo "Security gate: DISABLED for product $PRODUCT" ;;
            true) echo "Security gate: PASSED" ;;
            false)
              echo "::error::Security gate: FAILED. Details in TDxGuard."
              exit 1 ;;
            *)
              echo "::warning::Could not read the security gate of '$PRODUCT' (got: '$PASSED')" ;;
          esac
