# Clean for zizmor (pinned, no permissions, no persisted credentials): zizmor audits this
# repository's workflows too, and only the Opengrep rule's cases belong here.
name: deploy
on: push
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # ruleid: yaml.github-actions-gcp-service-account-key
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # ok: yaml.github-actions-gcp-service-account-key
          workload_identity_provider: projects/1/locations/global/workloadIdentityPools/github/providers/github
          service_account: deploy@example.iam.gserviceaccount.com
