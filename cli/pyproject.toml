[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tdxguard"
version = "0.1.3"
description = "Command line tool that scans a repository and sends the results to TDxGuard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = ["PyYAML>=5.4"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
tdxguard = "tdxguard.__main__:main"

[tool.setuptools]
# Listed explicitly: the engine and its helper scripts are subpackages.
packages = ["tdxguard", "tdxguard.engine", "tdxguard.engine.helpers"]

[tool.black]
line-length = 120
target-version = ["py39"]
# The helper scripts are embedded byte for byte in the CI templates (see
# tdxguard/engine/helpers/__init__.py); they keep the style they have there.
extend-exclude = "tdxguard/engine/helpers/(sarif_enrich|opengrep_prune_rules)\\.py"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["tdxguard/engine/helpers/sarif_enrich.py", "tdxguard/engine/helpers/opengrep_prune_rules.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP006/UP007/UP045: `list[str]`/`X | None` in annotations need Python 3.10 at runtime
# for the code paths that evaluate them; the tool supports 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]
