# Builds the standalone tdxguard executables (PyInstaller, one file, no Python needed) for
# five platforms, tests each one for real on its own OS, and publishes them as a GitHub
# Release with checksums.txt.
#
# Lives in tda-corp/tdx-guard-ci, next to cli/ (the package), install.sh and install.ps1.
# Its source is cli/packaging/tdx-guard-ci/.github/workflows/cli-release.yml in the TDxGuard
# repository; see cli/packaging/README.md there.
#
# - tag cli-vX.Y.Z: build, test, then create the release cli-vX.Y.Z (the tag must equal the
#   package version, or the build fails).
# - workflow_dispatch: build and test only; the executables are kept as workflow artifacts
#   for 3 days. No release.
name: tdxguard CLI release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # AlmaLinux 8 (glibc 2.28): the Linux executables run on glibc 2.28 and newer.
  LINUX_BUILD_IMAGE: almalinux:8.10@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: darwin, arch: x86_64, runner: macos-15-intel }
          - { os: linux, arch: x86_64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: x86_64, runner: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cli/tdxguard/__init__.py)
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "${REF_NAME#cli-v}" != "$version" ]; then
              echo "::error::tag $REF_NAME does not match the package version $version (cli/tdxguard/__init__.py)"
              exit 1
            fi
          fi
          suffix=""
          if [ "${{ matrix.os }}" = "windows" ]; then suffix=".exe"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=tdxguard-$version-${{ matrix.os }}-${{ matrix.arch }}$suffix" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build (macOS, Windows)
        if: matrix.os != 'linux'
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Relative paths: Git Bash on Windows and a backslashed $RUNNER_TEMP do not mix well.
          python -m venv ../.venv-build
          if [ "${{ matrix.os }}" = "windows" ]; then bin=../.venv-build/Scripts; else bin=../.venv-build/bin; fi
          "$bin/python" -m pip install --disable-pip-version-check --require-hashes -r packaging/requirements-build.txt
          "$bin/python" packaging/build.py --expect-version "$VERSION" --out dist

      - name: Build (Linux, in AlmaLinux 8 for glibc 2.28)
        if: matrix.os == 'linux'
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD":/cli -w /cli -e BUILD_UID="$(id -u)" -e BUILD_GID="$(id -g)" \
            "$LINUX_BUILD_IMAGE" sh packaging/build-linux.sh --expect-version "$VERSION" --out dist

      - name: Runs on glibc 2.28 without Python
        if: matrix.os == 'linux'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          # The build image is the oldest glibc supported; its Python is not on PATH.
          docker run --rm -v "$PWD/cli/dist:/dist:ro" "$LINUX_BUILD_IMAGE" sh -c \
            '! command -v python3 && ldd --version | head -n 1 && /dist/'"$ASSET"' --version && /dist/'"$ASSET"' tools list'

      - name: Size
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: ls -l "cli/dist/$ASSET"

      - name: Smoke test (tools install, native scan, no Python)
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          python cli/packaging/smoke.py "cli/dist/$ASSET" --work "$RUNNER_TEMP/smoke" --tools-dir "$RUNNER_TEMP/tools"

      - name: Smoke test (Windows PowerShell)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          $exe = Join-Path $PWD "cli/dist/$env:ASSET"
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'standalone') { throw "--version: $version" }
          $env:TDXGUARD_TOOLS_DIR = Join-Path $env:RUNNER_TEMP 'tools'
          $listing = & $exe tools list --json | ConvertFrom-Json
          $missing = @($listing.tools | Where-Object { $_.state -ne 'installed' })
          if ($missing.Count -gt 0) { throw "tools missing after install: $($missing.tool -join ', ')" }
          $summary = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'smoke/reports/summary.json') | ConvertFrom-Json
          foreach ($row in $summary.rows) {
            if ($row.findings -le 0) { throw "no findings in $($row.report)" }
            Write-Host "ok $($row.label): $($row.findings)"
          }

      - name: Unit tests
        # Also when the smoke test failed: both results matter, Windows especially.
        if: ${{ !cancelled() }}
        working-directory: cli
        run: |
          python -m venv ../.venv-test
          if [ "${{ matrix.os }}" = "windows" ]; then bin=../.venv-test/Scripts; else bin=../.venv-test/bin; fi
          "$bin/python" -m pip install --disable-pip-version-check --require-hashes -r packaging/requirements-build.txt
          "$bin/python" -m unittest -v

      - name: Show the scan's reports on failure
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/smoke/reports" ]; then
            ls -la "$RUNNER_TEMP/smoke/reports"
            cat "$RUNNER_TEMP/smoke/reports/summary.json" || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: cli/dist/${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdxguard-*
          path: dist
          merge-multiple: true

      - name: Checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version=${TAG#cli-v}
          for platform in darwin-arm64 darwin-x86_64 linux-x86_64 linux-arm64 windows-x86_64.exe; do
            test -f "tdxguard-$version-$platform" || { echo "::error::missing tdxguard-$version-$platform"; exit 1; }
          done
          sha256sum tdxguard-* | sort -k 2 > checksums.txt
          cat checksums.txt
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=${TAG#cli-v}
          cat > notes.md <<EOF
          Standalone \`tdxguard\` $version: one file, no Python needed.

          macOS and Linux:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$REPOSITORY/main/install.sh | sh
          \`\`\`

          Windows (PowerShell):

          \`\`\`
          irm https://raw.githubusercontent.com/$REPOSITORY/main/install.ps1 | iex
          \`\`\`

          Or download the file for your platform below and check it against \`checksums.txt\`.
          Linux builds need glibc 2.28 or newer (not Alpine/musl: use \`pipx\` or \`--engine docker\` there).
          EOF
          gh release create "$TAG" dist/* --repo "$REPOSITORY" --verify-tag --title "tdxguard $version" --notes-file notes.md
